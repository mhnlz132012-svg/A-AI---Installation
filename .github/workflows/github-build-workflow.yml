name: Build and Release A-AI Desktop App

on:
  push:
    tags:
      - 'v*' # Triggers on version tags (e.g., v1.1.0)
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  release:
    name: Build & Publish Desktop Packages
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/checkout@v4
        # We also need node setup to ensure dependencies compile cleanly
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Build & Publish Release
        # electron-builder will automatically compile and upload artifacts to GitHub Releases
        run: npx electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
